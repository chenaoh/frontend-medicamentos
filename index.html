
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Medicamentos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<div class="contenedor">

    <h1>Gestión de Medicamentos</h1>

    <!-- FORMULARIO DE REGISTRO -->
    <form id="formularioMedicamento" class="card">
        <h2>Registro / Edición de Medicamento</h2>

        <div class="grid-formulario">

            <!-- Fila 1 -->
            <div class="campo col-6">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required
                    placeholder="Ej. Paracetamol">
            </div>

            <div class="campo col-6">
                <label for="principioActivo">Principio activo:</label>
                <input type="text" id="principioActivo" required
                    placeholder="Ej. Acetaminofén">
            </div>

            <!-- Fila 2 -->
            <div class="campo col-4">
                <label for="laboratorio">Laboratorio:</label>
                <input type="text" id="laboratorio" required
                    placeholder="Ej. Genfar">
            </div>

            <div class="campo col-4">
                <label for="precio">Precio ($):</label>
                <input type="number" id="precio" min="0" step="0.01"
                    required placeholder="0.00">
            </div>

            <div class="campo col-4">
                <label for="stock">Stock:</label>
                <input type="number" id="stock" min="0"
                    required placeholder="0">
            </div>

        </div>

        <div class="botones">
            <button type="submit" id="btnGuardar"
                class="btn btn-primary">Guardar</button>
            <button type="button" id="btnLimpiar"
                class="btn btn-secondary">Limpiar</button>
        </div>
    </form>

    <!-- BUSCAR POR ID -->
    <div class="card">
        <h2>Buscar medicamento por ID</h2>
        <div class="buscar">
            <input type="number" id="idBuscar"
                placeholder="Ingrese el ID del medicamento">
            <button type="button" id="btnBuscar"
                class="btn btn-primary">Buscar</button>
            <button type="button" id="btnMostrarTodos"
                class="btn btn-secondary">Mostrar todos</button>
        </div>
    </div>

    <!-- TABLA DE RESULTADOS -->
    <div class="card">
        <h2>Medicamentos registrados</h2>
        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Principio activo</th>
                        <th>Laboratorio</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaMedicamentos">
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
