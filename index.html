
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Medicamentos</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<div class="contenedor">

    <h1>Gestión de Medicamentos</h1>

    <!-- ============================== -->
    <!-- FORMULARIO -->
    <!-- ============================== -->

    <form id="formularioMedicamento">

        <div class="campo">

            <label for="nombre">
                Nombre:
            </label>

            <input
                type="text"
                id="nombre"
                required>

        </div>


        <div class="campo">

            <label for="principioActivo">
                Principio activo:
            </label>

            <input
                type="text"
                id="principioActivo"
                required>

        </div>


        <div class="campo">

            <label for="laboratorio">
                Laboratorio:
            </label>

            <input
                type="text"
                id="laboratorio"
                required>

        </div>


        <div class="campo">

            <label for="precio">
                Precio:
            </label>

            <input
                type="number"
                id="precio"
                min="0"
                step="0.01"
                required>

        </div>


        <div class="campo">

            <label for="stock">
                Stock:
            </label>

            <input
                type="number"
                id="stock"
                min="0"
                required>

        </div>


        <div class="botones">

            <button
                type="submit"
                id="btnGuardar">
                Guardar
            </button>

            <button
                type="button"
                id="btnLimpiar">
                Limpiar
            </button>

        </div>

    </form>


    <!-- ============================== -->
    <!-- BUSCAR POR ID -->
    <!-- ============================== -->

    <h2>Buscar medicamento por ID</h2>

    <div class="buscar">

        <input
            type="number"
            id="idBuscar"
            placeholder="Ingrese el ID">

        <button
            type="button"
            id="btnBuscar">
            Buscar
        </button>

        <button
            type="button"
            id="btnMostrarTodos">
            Mostrar todos
        </button>

    </div>


    <!-- ============================== -->
    <!-- TABLA -->
    <!-- ============================== -->

    <h2>Medicamentos registrados</h2>

    <table>

        <thead>

        <tr>

            <th>ID</th>
            <th>Nombre</th>
            <th>Principio activo</th>
            <th>Laboratorio</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>

        </tr>

        </thead>


        <tbody id="tablaMedicamentos">
        </tbody>

    </table>

</div>


<script src="js/app.js"></script>

</body>

</html>
